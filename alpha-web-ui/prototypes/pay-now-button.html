<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PayNowButton — PODS</title>
<style>
:root {
  --surface-level-1: #ffffff;
  --surface-level-4: #f5f5f5;
  --text-neutral-strong: #282828;
  --text-neutral-moderate: #414244;
  --text-neutral-medium: #7e7e7e;
  --text-neutral-weak: #cacaca;
  --text-neutral-inverse: #ffffff;
  --text-primary-strong: #004299;
  --text-primary-medium: #1576db;
  --background-primary-strong: #004299;
  --background-primary-medium: #1576db;
  --background-primary-weak: #dfedff;
  --border-primary-medium: #1576db;
  --border-neutral-weak: #ebebeb;
  --gap-m: 4px;
  --gap-xl: 8px;
  --gap-2xl: 12px;
  --gap-3xl: 16px;
  --gap-4xl: 24px;
  --radius-3xl: 24px;
  --radius-max: 64px;
  --page-gutter: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #f0f2f5;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 32px;
}

.phone-frame {
  width: 390px;
  background: var(--surface-level-4);
  border-radius: 48px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.06);
  overflow: hidden;
  font-size: 14px;
}

.phone-top {
  background: var(--surface-level-1);
  padding: 16px 20px 0;
  display: flex;
  align-items: center;
  gap: 12px;
}
.phone-top .back { font-size: 20px; color: var(--text-neutral-strong); cursor: pointer; }
.phone-top .title { font-size: 17px; font-weight: 600; color: var(--text-neutral-strong); }

.phone-body {
  padding: var(--gap-3xl) var(--page-gutter);
  display: flex;
  flex-direction: column;
  gap: var(--gap-4xl);
}

/* ── Section label + card ── */
.section-tight { display: flex; flex-direction: column; gap: 0; }
.section-label {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-neutral-strong);
  padding: 8px 4px;
}
.card {
  background: var(--surface-level-1);
  border-radius: var(--radius-3xl);
  padding: var(--gap-3xl);
}

/* ── Recipient strip ── */
.recipient {
  display: flex;
  align-items: center;
  gap: var(--gap-3xl);
}
.avatar {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: var(--background-primary-weak);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700;
  color: var(--text-primary-strong);
  flex-shrink: 0;
}
.recipient-info { flex: 1; }
.recipient-name {
  font-size: 16px; font-weight: 600;
  color: var(--text-neutral-strong);
  line-height: 20px;
}
.recipient-vpa {
  font-size: 12px; font-weight: 400;
  color: var(--text-neutral-medium);
  margin-top: 2px;
}

/* ── Amount hero ── */
.amount-hero {
  text-align: center;
  padding: 8px 0 4px;
}
.amount-main {
  font-size: 42px; font-weight: 700;
  color: var(--text-neutral-strong);
  letter-spacing: -1px;
  line-height: 1;
}
.amount-label {
  font-size: 12px; color: var(--text-neutral-medium); margin-top: 6px;
}

/* ── Detail rows ── */
.detail-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-neutral-weak);
  font-size: 14px;
}
.detail-row:last-child { border-bottom: none; padding-bottom: 0; }
.detail-label { color: var(--text-neutral-medium); }
.detail-value { font-weight: 500; color: var(--text-neutral-strong); }

/* ── Bottom CTA bar ── */
.bottom-bar {
  padding: var(--gap-3xl) var(--page-gutter) 28px;
  background: var(--surface-level-1);
  border-top: 1px solid var(--border-neutral-weak);
  display: flex;
  flex-direction: column;
  gap: var(--gap-2xl);
}

/* ── PODS primary button ── */
.btn-pay-now {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 15px 24px;
  border-radius: var(--radius-max);
  border: none;
  background: var(--background-primary-medium);
  color: var(--text-neutral-inverse);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: background 0.15s;
  font-family: inherit;
  outline: none;
}
.btn-pay-now:hover { background: var(--background-primary-strong); }
.btn-pay-now:active { background: var(--background-primary-strong); transform: scale(0.99); }

/* ── PODS outline button ── */
.btn-outline {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 12px 24px;
  border-radius: var(--radius-max);
  border: 1.5px solid var(--border-primary-medium);
  background: transparent;
  color: var(--text-primary-medium);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.12s;
  outline: none;
}
.btn-outline:hover { background: var(--background-primary-weak); }

/* ── Loading state ── */
.btn-loading {
  background: var(--text-neutral-weak) !important;
  cursor: not-allowed;
}
.spinner {
  width: 18px; height: 18px;
  border: 2.5px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Showcase layout (outside phone) ── */
.showcase {
  width: 390px;
  background: #ffffff;
  border-radius: 16px;
  padding: 28px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.1);
  margin-top: 24px;
}
.showcase h3 {
  font-size: 13px;
  font-weight: 600;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 20px;
}
.showcase-grid {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.showcase-row { display: flex; flex-direction: column; gap: 6px; }
.showcase-row label {
  font-size: 11px;
  color: #aaa;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}
</style>
</head>
<body>
<div class="wrap">

  <!-- Phone context: how the button appears in a real screen -->
  <div class="phone-frame">
    <div class="phone-top">
      <span class="back">←</span>
      <span class="title">Review Payment</span>
    </div>
    <div class="phone-body">

      <div class="section-tight">
        <div class="section-label">Paying to</div>
        <div class="card">
          <div class="recipient">
            <div class="avatar">RK</div>
            <div class="recipient-info">
              <div class="recipient-name">Rahul Kumar</div>
              <div class="recipient-vpa">rahulk@paytm</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card" style="text-align:center; padding: 24px 16px;">
        <div class="amount-main">₹1,250</div>
        <div class="amount-label">Amount</div>
      </div>

      <div class="section-tight">
        <div class="section-label">Details</div>
        <div class="card">
          <div class="detail-row">
            <span class="detail-label">Paying from</span>
            <span class="detail-value">HDFC ••••4521</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Note</span>
            <span class="detail-value">Lunch split</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Charges</span>
            <span class="detail-value" style="color:var(--text-positive-strong,#158939)">Free</span>
          </div>
        </div>
      </div>

    </div>

    <div class="bottom-bar">
      <button class="btn-pay-now" onclick="showLoading(this)">
        Pay ₹1,250
      </button>
      <button class="btn-outline">Change amount</button>
    </div>
  </div>

  <!-- All states showcase -->
  <div class="showcase">
    <h3>Button states</h3>
    <div class="showcase-grid">
      <div class="showcase-row">
        <label>Default — filled</label>
        <button class="btn-pay-now">Pay Now</button>
      </div>
      <div class="showcase-row">
        <label>With amount</label>
        <button class="btn-pay-now">Pay  <strong>₹1,250</strong></button>
      </div>
      <div class="showcase-row">
        <label>Loading</label>
        <button class="btn-pay-now btn-loading" disabled>
          <div class="spinner"></div>
          Processing…
        </button>
      </div>
      <div class="showcase-row">
        <label>Outline (secondary action)</label>
        <button class="btn-outline">Change amount</button>
      </div>
      <div class="showcase-row">
        <label>Disabled (avoid — prefer inline errors)</label>
        <button class="btn-pay-now" style="background:var(--text-neutral-weak);cursor:not-allowed;" disabled>Pay Now</button>
      </div>
    </div>
  </div>

</div>

<script>
function showLoading(btn) {
  btn.innerHTML = '<div class="spinner"></div> Processing…';
  btn.classList.add('btn-loading');
  btn.disabled = true;
  setTimeout(() => {
    btn.innerHTML = 'Pay ₹1,250';
    btn.classList.remove('btn-loading');
    btn.disabled = false;
  }, 2000);
}
</script>
</body>
</html>
